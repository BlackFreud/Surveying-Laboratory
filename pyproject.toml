[project]
name = "dtm-simulator"
version = "1.0.0"
description = "Digital Terrain Model Simulator for Civil Engineering Surveying Laboratory"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.62,<2",
    "pandas>=3.0,<4",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "plotly>=7.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101", # allow assert in tests
    "E501", # line length handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
